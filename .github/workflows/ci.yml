name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate SKILL.md frontmatter
        run: |
          python scripts/validate_skill.py first-contribution/SKILL.md
          python scripts/validate_skill.py rag-contribution/SKILL.md

      - name: Package skill
        run: bash scripts/package_skill.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: first-contribution.skill
          path: first-contribution.skill
